repo_owner=shchuchkin-pkims
repo_name=fear
app_path=./fear
version_arg=--version
asset_prefix=fear

# Ed25519 public key that release archives must be signed with (base64).
# Generate a keypair with `fear-sign keygen`, put the PUBLIC half here and the
# SECRET half in the FEAR_SIGN_KEY repository secret. See doc/RELEASE_SIGNING.md.
#
# Until this is set the updater refuses to install anything: an updater that
# cannot check who signed a release is a remote code execution primitive.
#pubkey=
